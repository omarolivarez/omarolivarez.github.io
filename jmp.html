    <script>

    <style>
        /* ── Base typography ── */
        body {
          font-family: 'Source Sans 3', sans-serif;
          padding-top: 72px;
          color: #1a1a1a;
        }
        h1, h2, h3, h4, h5, h6 {
          font-family: 'Bitter', serif;
        }

        /* ── Navbar ── */
        .navbar {
          border-bottom: 1px solid #e9ecef;
        }
        .navbar-brand {
          font-family: 'Bitter', serif;
          font-weight: 600;
        }
        .navbar-brand-icon {
          width: 24px;
          height: auto;
          margin-right: 8px;
        }
        .nav-link {
          font-family: 'Source Sans 3', sans-serif;
          color: rgba(0,0,0,.5) !important;
        }
        .nav-item.active .nav-link {
          border-bottom: 2px solid #333;
          padding-bottom: 0.3rem;
          color: #000 !important;
          font-weight: 600;
        }

        /* ── Page header ── */
        .page-header {
          background-color: #f8f9fa;
          padding: 3.5rem 0 3rem;
          margin-bottom: 2.5rem;
          text-align: center;
        }
        .page-header h1 {
          font-size: 2.1rem;
          font-weight: 700;
          line-height: 1.3;
          margin: 0 auto;
          max-width: 640px;
        }
        .draft-badge {
          display: inline-block;
          font-family: 'Source Sans 3', sans-serif;
          font-size: 0.72rem;
          font-weight: 700;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          padding: 0.25rem 0.65rem;
          border: 1.5px solid #A51C30;
          color: #A51C30;
          border-radius: 3px;
          margin-bottom: 1rem;
        }
        .draft-byline {
          color: #666;
          font-size: 1rem;
          margin: 0.85rem 0 0;
        }

        /* ── Hero / intro ── */
        .draft-hero {
          max-width: 620px;
          margin: 0 auto;
          text-align: center;
        }
        .draft-lede {
          font-size: 1.05rem;
          line-height: 1.7;
          color: #444;
          margin-bottom: 1.75rem;
        }

        /* ── PDF actions ── */
        .pdf-actions {
          margin-bottom: 2rem;
          display: flex;
          justify-content: center;
          flex-wrap: wrap;
          gap: 0.75rem;
        }
        .btn-crimson {
          background-color: #A51C30;
          border-color: #A51C30;
          color: #fff;
        }
        .btn-crimson:hover {
          background-color: #841526;
          border-color: #841526;
          color: #fff;
        }

        /* ── Paginated PDF viewer ── */
        #pdf-viewer-wrap {
          display: none;
          max-width: 900px;
          margin: 0 auto 3rem;
        }
        .pdf-toolbar {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 1.25rem;
          padding: 0.6rem 0;
          margin-bottom: 1rem;
        }
        .pdf-toolbar button {
          background-color: transparent;
          border: 1.5px solid #A51C30;
          color: #A51C30;
          border-radius: 4px;
          padding: 0.35rem 0.9rem;
          font-family: 'Source Sans 3', sans-serif;
          font-size: 0.9rem;
          cursor: pointer;
          transition: background-color 0.15s, color 0.15s;
        }
        .pdf-toolbar button:hover:not(:disabled) {
          background-color: #A51C30;
          color: #fff;
        }
        .pdf-toolbar button:disabled {
          opacity: 0.35;
          cursor: default;
        }
        #pdf-page-indicator {
          font-size: 0.92rem;
          color: #444;
          min-width: 9rem;
          text-align: center;
        }
        .pdf-canvas-wrap {
          display: flex;
          justify-content: center;
          padding: 1.5rem;
          background-color: #f1f2f4;
          border: 1px solid #e9ecef;
          border-radius: 4px;
          min-height: 40vh;
          max-height: 85vh;
          overflow: auto;
        }
        #pdf-canvas {
          background-color: #fff;
          box-shadow: 0 1px 6px rgba(0,0,0,0.15);
          display: none;
        }
        .pdf-status {
          color: #777;
          font-size: 0.92rem;
          text-align: center;
          padding: 2rem 0;
        }
        .pdf-status a {
          color: #A51C30;
        }
    </style>

    <title>Omar Olivarez | Draft</title>
  </head>
  <body>

    <nav class="navbar navbar-expand-md navbar-light fixed-top bg-white">
      <div class="container-fluid">
        <div class="d-flex align-items-center">
          <img src="/assets/harvard-icon.jpg" class="navbar-brand-icon" alt="Icon">
          <a class="navbar-brand mb-0" href="index.html">Omar Olivarez</a>
        </div>

        <button class="navbar-toggler" type="button" aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMain">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="research.html">Research</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="teaching.html">Teaching</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main role="main">

      <div class="page-header">
        <div class="container">
          <div class="draft-badge">Working Paper — Draft</div>
          <h1>Post Machina: Automation and the Organization of Work</h1>
          <p class="draft-byline">Omar Olivarez</p>
        </div>
      </div>

      <div class="container">

        <div class="draft-hero">
          <p class="draft-lede">This page hosts a working draft of my job market paper.</p>

          <div class="pdf-actions">
            <button class="btn btn-crimson" type="button" id="btn-launch-viewer">
              Launch PDF Viewer
            </button>
          </div>
        </div>

        <div id="pdf-viewer-wrap">
          <div class="pdf-toolbar">
            <button type="button" id="pdf-prev" disabled>&larr; Previous</button>
            <span id="pdf-page-indicator">Loading…</span>
            <button type="button" id="pdf-next" disabled>Next &rarr;</button>
          </div>
          <div class="pdf-canvas-wrap">
            <div class="pdf-status" id="pdf-status">Loading PDF…</div>
            <canvas id="pdf-canvas"></canvas>
          </div>
        </div>

      </div>

    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmFvnSEKH7qNUZXFQdFMLNb9T8BN" crossorigin="anonymous"></script>
    <script>
      (function() {
        var toggler = document.querySelector('.navbar-toggler');
        var collapse = document.getElementById('navbarMain');
        if (!toggler || !collapse) return;
        toggler.addEventListener('click', function(e) {
          e.stopPropagation();
          var open = collapse.classList.toggle('show');
          toggler.setAttribute('aria-expanded', open.toString());
        });
        document.addEventListener('click', function(e) {
          if (collapse.classList.contains('show') && !collapse.contains(e.target) && !toggler.contains(e.target)) {
            collapse.classList.remove('show');
            toggler.setAttribute('aria-expanded', 'false');
          }
        });
      })();

    </script>

    <!-- PDF.js paginated viewer -->
    <script type="module">
      import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.min.mjs";
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.worker.min.mjs";

      var PDF_URL = '/assets/olivarez_jmp_draft.pdf';

      var launchBtn = document.getElementById('btn-launch-viewer');
      var wrap = document.getElementById('pdf-viewer-wrap');
      var canvas = document.getElementById('pdf-canvas');
      var ctx = canvas.getContext('2d');
      var statusEl = document.getElementById('pdf-status');
      var pageIndicator = document.getElementById('pdf-page-indicator');
      var prevBtn = document.getElementById('pdf-prev');
      var nextBtn = document.getElementById('pdf-next');

      var pdfDoc = null;
      var currentPage = 1;
      var totalPages = 0;
      var rendering = false;
      var pendingPage = null;
      var furthestPage = 0;
      var reachedDeciles = {};

      function updateControls() {
        pageIndicator.textContent = 'Page ' + currentPage + ' of ' + totalPages;
        prevBtn.disabled = currentPage <= 1;
        nextBtn.disabled = currentPage >= totalPages;
      }

      // Fires once per decile (10%, 20%, ..., 100%) the first time a reader's
      // furthest page reaches that fraction of the document. Only tracks forward
      // progress, so paging backward does not re-trigger an earlier decile.
      function checkMilestones(num) {
        if (num <= furthestPage) return;
        furthestPage = num;
        for (var d = 1; d <= 10; d++) {
          var pct = d * 10;
          if (reachedDeciles[pct]) continue;
          var thresholdPage = Math.ceil((pct / 100) * totalPages);
          if (furthestPage >= thresholdPage) {
            reachedDeciles[pct] = true;
            gtag('event', 'pdf_milestone_reached', {
              milestone_pct: pct,
              page_number: furthestPage,
              total_pages: totalPages
            });
          }
        }
      }

      function renderPage(num) {
        if (rendering) {
          pendingPage = num;
          return;
        }
        rendering = true;

        pdfDoc.getPage(num).then(function(page) {
          var containerWidth = canvas.parentElement.clientWidth - 48; // minus wrap padding
          var unscaledViewport = page.getViewport({ scale: 1 });
          var scale = Math.min(containerWidth / unscaledViewport.width, 1.6);
          var viewport = page.getViewport({ scale: scale });
          var outputScale = window.devicePixelRatio || 1;

          canvas.width = Math.floor(viewport.width * outputScale);
          canvas.height = Math.floor(viewport.height * outputScale);
          canvas.style.width = Math.floor(viewport.width) + 'px';
          canvas.style.height = Math.floor(viewport.height) + 'px';

          var transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;

          return page.render({
            canvasContext: ctx,
            viewport: viewport,
            transform: transform
          }).promise;
        }).then(function() {
          rendering = false;
          statusEl.style.display = 'none';
          canvas.style.display = 'block';
          currentPage = num;
          updateControls();
          gtag('event', 'pdf_page_view', { page_number: num, total_pages: totalPages });
          checkMilestones(num);

          if (pendingPage !== null) {
            var next = pendingPage;
            pendingPage = null;
            renderPage(next);
          }
        }).catch(function(err) {
          rendering = false;
          console.error('PDF render error:', err);
        });
      }

      function goToPage(num) {
        if (!pdfDoc) return;
        num = Math.max(1, Math.min(totalPages, num));
        renderPage(num);
      }

      prevBtn.addEventListener('click', function() { goToPage(currentPage - 1); });
      nextBtn.addEventListener('click', function() { goToPage(currentPage + 1); });

      document.addEventListener('keydown', function(e) {
        if (wrap.style.display !== 'block') return;
        if (e.key === 'ArrowRight') goToPage(currentPage + 1);
        if (e.key === 'ArrowLeft') goToPage(currentPage - 1);
      });

      launchBtn.addEventListener('click', function() {
        var isOpen = wrap.style.display === 'block';

        if (isOpen) {
          wrap.style.display = 'none';
          launchBtn.textContent = 'Launch PDF Viewer';
          return;
        }

        wrap.style.display = 'block';
        launchBtn.textContent = 'Close PDF Viewer';
        gtag('event', 'pdf_view_inline');
        wrap.scrollIntoView({ behavior: 'smooth', block: 'start' });

        if (!pdfDoc) {
          pdfjsLib.getDocument(PDF_URL).promise.then(function(pdf) {
            pdfDoc = pdf;
            totalPages = pdf.numPages;
            renderPage(1);
          }).catch(function(err) {
            statusEl.textContent = 'Could not load the PDF. Please refresh and try again.';
            console.error('PDF load error:', err);
          });
        }
      });
    </script>

  </body>
</html>
